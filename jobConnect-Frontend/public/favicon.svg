<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Gradient matching Logo.jsx (Indigo 700 to Cyan 400) -->
    <linearGradient id="bg-grad" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Stroke Gradient matching Logo.jsx -->
    <linearGradient id="jc-gradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background Container -->
  <rect width="48" height="48" rx="12" fill="url(#bg-grad)" />

  <!-- Letter 'J' Ribbon Curve -->
  <path
    d="M20 10V28C20 33 16 36 11 36C8 36 6 34.5 6 34.5"
    stroke="url(#jc-gradient)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Interlocking 'C' Connection Arc -->
  <path
    d="M40 18C37 12 30 11 25 15C19 20 20 31 27 34C34 37 40 33 42 28"
    stroke="url(#jc-gradient)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Connected Bridge Spark Dot -->
  <circle cx="23.5" cy="23.5" r="2.8" fill="#38BDF8" />
</svg>